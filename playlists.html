<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Playlists auf Klar & Simple – Besser leben, Klarer denken, Menschen lesen, Menschen entschlüsselt." />
  <title>Playlists – Klar &amp; Simple</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',
              500:'#4166ee',600:'#3651d6',700:'#2b40b0',800:'#22348c',900:'#111a4a',950:'#080d29'
            },
            ink: { 900:'#050818', 800:'#0a0f28', 700:'#111842' },
            accent: { yellow:'#FCD34D', red:'#EF4444' }
          },
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            body:    ['Inter', 'system-ui', 'sans-serif'],
            hand:    ['Caveat', 'cursive'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-ink-900 text-white font-body antialiased overflow-x-hidden">

  <!-- Animated Blob Background -->
  <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="noise"></div>
  </div>

  <!-- Nav -->
  <nav id="nav" class="fixed top-4 left-4 right-4 z-50 rounded-2xl backdrop-blur-xl bg-ink-800/60 border border-white/10 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-3">
      <a href="./index.html" class="flex items-center gap-2 group">
        <div class="w-10 h-10 rounded-xl bg-brand-500 grid place-items-center font-display font-bold text-lg relative overflow-hidden shadow-lg shadow-brand-500/30">
          <span class="relative z-10">KS</span>
        </div>
        <span class="font-display font-bold text-lg tracking-tight hidden sm:inline">Klar &amp; Simple</span>
      </a>
      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-white/70">
        <a href="./index.html#videos" class="hover:text-white transition cursor-pointer">Videos</a>
        <a href="./playlists.html" class="text-white transition cursor-pointer">Playlists</a>
        <a href="./index.html#produkte" class="hover:text-white transition cursor-pointer">Produkte</a>
        <a href="./index.html#about" class="hover:text-white transition cursor-pointer">Über mich</a>
      </div>
      <a href="https://www.youtube.com/@klarundsimple" target="_blank" rel="noopener"
         class="group inline-flex items-center gap-2 rounded-xl bg-white text-ink-900 px-4 py-2 text-sm font-semibold hover:bg-accent-yellow transition cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.02 3.02 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.02 3.02 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.02 3.02 0 0 0 2.121 2.136c1.872.505 9.377.505 9.377.505s7.505 0 9.377-.505a3.02 3.02 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814ZM9.545 15.568V8.432L15.818 12l-6.273 3.568Z"/></svg>
        YouTube
      </a>
    </div>
  </nav>

  <!-- Header -->
  <section class="pt-40 pb-16 px-6">
    <div class="max-w-6xl mx-auto text-center">
      <div data-reveal class="text-brand-400 uppercase text-xs font-bold tracking-[0.3em] mb-4">Meine Themenwelten</div>
      <h1 data-reveal class="font-display font-extrabold text-5xl sm:text-7xl md:text-8xl leading-[0.9] tracking-tighter">
        4 Playlists.<br />
        <span class="text-brand-500">Ein Ziel:</span><br /> Verstehen.
      </h1>
      <p data-reveal class="mt-8 text-lg text-white/70 max-w-2xl mx-auto">
        Meine Videos sind in vier klare Themenwelten sortiert. Such dir aus, was dich gerade am meisten interessiert — und tauche ein.
      </p>
    </div>
  </section>

  <!-- Playlists Grid -->
  <section class="pb-24 sm:pb-32 px-6">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8" id="playlists-grid"></div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-white/10 py-16 px-6">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between gap-6 text-sm text-white/40">
      <div>© <span id="year"></span> Klar &amp; Simple</div>
      <div class="flex gap-6">
        <a href="./index.html" class="hover:text-white transition cursor-pointer">Startseite</a>
        <a href="./impressum.html" class="hover:text-white transition cursor-pointer">Impressum</a>
        <a href="./datenschutz.html" class="hover:text-white transition cursor-pointer">Datenschutz</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const PLAYLISTS = [
      {
        id: 'PLazWDtWMWvc8',
        emoji: '⏰',
        title: 'Besser leben',
        subtitle: 'Kleine Schritte. Große Wirkung.',
        count: 16,
        gradient: 'from-amber-500 via-orange-500 to-red-500',
        text: 'Kleine Gewohnheiten, die im Alltag wirklich etwas verändern. Von Morgenroutinen über Produktivität bis zu Wochenend-Ritualen — was tun glückliche Menschen anders?'
      },
      {
        id: 'PLcMzFnHaz5Q0',
        emoji: '💭',
        title: 'Klarer denken & innere Ruhe',
        subtitle: 'Vom Grübeln zur Klarheit.',
        count: 11,
        gradient: 'from-blue-500 via-indigo-500 to-violet-600',
        text: 'Weniger Gedanken-Chaos, mehr innere Ruhe. Wie du aus dem Kopf raus und ins Leben zurück findest — mit Erkenntnissen aus Neurowissenschaft und Psychologie.'
      },
      {
        id: 'PLLxHeC6BNFP8',
        emoji: '🎭',
        title: 'Menschen lesen',
        subtitle: 'Zwischen den Zeilen verstehen.',
        count: 12,
        gradient: 'from-rose-500 via-pink-500 to-fuchsia-600',
        text: 'Was Menschen wirklich meinen, wenn sie etwas anderes sagen. Körpersprache, Mikroausdrücke, versteckte Muster — so verstehst du sofort, wer dir gegenübersteht.'
      },
      {
        id: 'PLaQ520g3Dhhk',
        emoji: '🧠',
        title: 'Menschen entschlüsselt',
        subtitle: 'Die Psychologie hinter uns.',
        count: 19,
        gradient: 'from-emerald-500 via-teal-500 to-cyan-600',
        text: 'Warum wir sind, wer wir sind. Kindheitsprägung, Persönlichkeit, unbewusste Muster — die tiefen Mechanismen, die unser Leben lenken.'
      }
    ];

    const CACHE_KEY = 'ks-playlists-thumbs-v1';
    const CACHE_TTL = 60 * 60 * 1000;

    function render(items) {
      const grid = document.getElementById('playlists-grid');
      grid.innerHTML = items.map((p, i) => `
        <a href="https://www.youtube.com/playlist?list=${p.id}" target="_blank" rel="noopener"
           class="playlist-card group relative rounded-3xl overflow-hidden bg-ink-800 border border-white/10 hover:border-brand-500/50 transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl hover:shadow-brand-500/20 cursor-pointer flex flex-col"
           data-reveal>
          <div class="relative aspect-video overflow-hidden">
            ${p.thumb
              ? `<img src="${p.thumb}" alt="" loading="lazy" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />`
              : `<div class="w-full h-full bg-gradient-to-br ${p.gradient}"></div>`}
            <div class="absolute inset-0 bg-gradient-to-t from-ink-900 via-ink-900/40 to-transparent"></div>
            <div class="absolute top-4 right-4 rounded-full bg-black/60 backdrop-blur px-3 py-1 text-xs font-semibold">${p.count} Videos</div>
          </div>
          <div class="p-6 sm:p-8 flex-1 flex flex-col">
            <h2 class="font-display font-bold text-3xl leading-tight group-hover:text-brand-300 transition">${p.title}</h2>
            <div class="font-hand text-2xl text-brand-300 mt-1">${p.subtitle}</div>
            <p class="mt-4 text-white/70 leading-relaxed">${p.text}</p>
            <div class="mt-6 pt-6 border-t border-white/10 flex items-center justify-between">
              <span class="text-xs uppercase tracking-widest text-white/50">Zur Playlist</span>
              <span class="inline-flex items-center gap-2 rounded-full bg-brand-500 group-hover:bg-brand-400 px-4 py-2 text-sm font-semibold transition">
                Ansehen
                <svg class="w-4 h-4 transition group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
              </span>
            </div>
          </div>
        </a>
      `).join('');

      // Reveal
      grid.querySelectorAll('[data-reveal]').forEach((el, i) => {
        setTimeout(() => el.classList.add('is-visible'), 80 * i);
      });
    }

    async function loadThumbnails() {
      // Try cache
      let cache = null;
      try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch {}
      if (cache && Date.now() - cache.ts < CACHE_TTL) {
        PLAYLISTS.forEach(p => { p.thumb = cache.thumbs[p.id] || null; });
        render(PLAYLISTS);
        return;
      }

      // Render placeholders first
      render(PLAYLISTS);

      // Fetch each playlist's latest video for thumbnail
      const thumbs = {};
      await Promise.all(PLAYLISTS.map(async (p) => {
        try {
          const rss = `https://www.youtube.com/feeds/videos.xml?playlist_id=${p.id}`;
          const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.status === 'ok' && data.items && data.items[0]) {
            const link = data.items[0].link;
            const vid = new URL(link).searchParams.get('v');
            if (vid) {
              const thumb = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
              p.thumb = thumb;
              thumbs[p.id] = thumb;
            }
          }
        } catch (e) { console.warn('thumb fail', p.id, e); }
      }));

      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), thumbs })); } catch {}
      render(PLAYLISTS);
    }

    loadThumbnails();

    // Reveal observer for header
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));

    // Nav scrolled state
    const nav = document.getElementById('nav');
    const setNav = () => nav.classList.toggle('is-scrolled', window.scrollY > 20);
    setNav(); window.addEventListener('scroll', setNav, { passive: true });
  </script>
</body>
</html>
