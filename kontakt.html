<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Schreib mir – Kontaktformular von Klar & Simple." />
  <title>Kontakt – Klar &amp; Simple</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#4166ee',600:'#3651d6',700:'#2b40b0',800:'#22348c',900:'#111a4a',950:'#080d29' },
            ink:   { 900:'#050818', 800:'#0a0f28', 700:'#111842' },
            accent: { yellow:'#FCD34D', red:'#EF4444' }
          },
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            body:    ['Inter', 'system-ui', 'sans-serif'],
            hand:    ['Caveat', 'cursive'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-ink-900 text-white font-body antialiased overflow-x-hidden">

  <!-- Scroll progress bar -->
  <div id="scroll-progress"></div>

  <!-- Animated Blob Background -->
  <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="noise"></div>
  </div>

  <!-- Nav -->
  <nav id="nav" class="fixed top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 z-50 rounded-2xl backdrop-blur-xl bg-ink-800/60 border border-white/10 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 py-3">
      <a href="./index.html" class="flex items-center gap-2 group">
        <div class="w-10 h-10 rounded-xl bg-brand-500 grid place-items-center font-display font-bold text-lg shadow-lg shadow-brand-500/30">KS</div>
        <span class="font-display font-bold text-lg tracking-tight hidden sm:inline">Klar &amp; Simple</span>
      </a>
      <a href="./index.html" class="text-sm text-white/70 hover:text-white transition cursor-pointer">← Zur Startseite</a>
    </div>
  </nav>

  <main class="pt-32 sm:pt-40 pb-24 px-6">
    <div class="max-w-3xl mx-auto">
      <!-- Header -->
      <div data-reveal class="text-center mb-14">
        <div class="text-brand-400 uppercase text-xs font-bold tracking-[0.3em] mb-4">Kontakt</div>
        <h1 class="font-display font-extrabold text-5xl sm:text-7xl leading-[0.95] tracking-tighter">
          Schreib<br /><span class="text-brand-500">mir.</span>
        </h1>
        <p class="mt-6 text-white/70 max-w-lg mx-auto">
          Feedback, Fragen, Kooperationsanfragen — ich lese jede Nachricht.<br />Meistens antworte ich innerhalb von 1-3 Tagen.
        </p>
      </div>

      <!-- Form -->
      <div data-reveal class="relative rounded-[2rem] sm:rounded-[2.5rem] overflow-hidden">
        <!-- Gradient background -->
        <div class="newsletter-gradient absolute inset-0"></div>
        <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full bg-accent-yellow/30 blur-3xl newsletter-blob-1"></div>
        <div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full bg-brand-300/40 blur-3xl newsletter-blob-2"></div>

        <div class="relative p-6 sm:p-10">
          <div class="rounded-[1.5rem] bg-ink-900/80 backdrop-blur-xl border border-white/15 p-6 sm:p-10 shadow-2xl">
            <form id="contact-form" class="space-y-5">
              <!-- Web3Forms access key (Platzhalter — nach dem Anlegen bei web3forms.com hier eintragen) -->
              <input type="hidden" name="access_key" value="73f258ec-f4a3-4867-87ff-8ef75f81ff8c" />
              <!-- Optional: eigenes Subject -->
              <input type="hidden" name="subject" value="Neue Nachricht über klar-und-simple.de" />
              <!-- Bot honeypot -->
              <input type="checkbox" name="botcheck" class="hidden" style="display:none" tabindex="-1" autocomplete="off" />
              <!-- Redirect nach Absenden (optional, hier lassen wir es leer und zeigen Erfolg inline) -->

              <div class="grid sm:grid-cols-2 gap-5">
                <div>
                  <label class="text-xs uppercase tracking-widest text-white/60 font-bold">Dein Name</label>
                  <input type="text" name="name" required autocomplete="name" placeholder="Robert Beispiel"
                         class="mt-2 w-full rounded-2xl bg-white/10 border border-white/15 text-white placeholder-white/40 px-4 py-3 outline-none focus:border-accent-yellow focus:ring-4 focus:ring-accent-yellow/20 font-medium transition" />
                </div>
                <div>
                  <label class="text-xs uppercase tracking-widest text-white/60 font-bold">Deine E-Mail</label>
                  <input type="email" name="email" required autocomplete="email" placeholder="robert@beispiel.de"
                         class="mt-2 w-full rounded-2xl bg-white/10 border border-white/15 text-white placeholder-white/40 px-4 py-3 outline-none focus:border-accent-yellow focus:ring-4 focus:ring-accent-yellow/20 font-medium transition" />
                </div>
              </div>

              <div>
                <label class="text-xs uppercase tracking-widest text-white/60 font-bold">Betreff (optional)</label>
                <input type="text" name="topic" placeholder="Worum geht's?"
                       class="mt-2 w-full rounded-2xl bg-white/10 border border-white/15 text-white placeholder-white/40 px-4 py-3 outline-none focus:border-accent-yellow focus:ring-4 focus:ring-accent-yellow/20 font-medium transition" />
              </div>

              <div>
                <label class="text-xs uppercase tracking-widest text-white/60 font-bold">Deine Nachricht</label>
                <textarea name="message" required rows="6" placeholder="Schreib einfach los…"
                          class="mt-2 w-full rounded-2xl bg-white/10 border border-white/15 text-white placeholder-white/40 px-4 py-3 outline-none focus:border-accent-yellow focus:ring-4 focus:ring-accent-yellow/20 font-medium transition resize-y"></textarea>
              </div>

              <label class="flex items-start gap-3 text-sm text-white/70">
                <input type="checkbox" required name="privacy" class="mt-1 accent-accent-yellow" />
                <span>Ich habe die <a href="./datenschutz.html" class="text-accent-yellow underline hover:text-yellow-300">Datenschutzerklärung</a> gelesen und stimme zu, dass meine Angaben zur Beantwortung meiner Anfrage verarbeitet werden.</span>
              </label>

              <button type="submit" id="submit-btn"
                      class="group w-full inline-flex items-center justify-center gap-2 rounded-2xl bg-accent-yellow hover:bg-yellow-300 text-ink-900 px-6 py-4 font-bold transition cursor-pointer disabled:opacity-70 disabled:cursor-default">
                <span id="submit-label">Nachricht senden</span>
                <svg class="w-4 h-4 transition group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
              </button>

              <div id="form-status" class="hidden text-center text-sm rounded-2xl p-4"></div>
            </form>
          </div>
        </div>
      </div>

      <!-- Alt contact info -->
      <div data-reveal class="mt-10 text-center text-sm text-white/50">
        Lieber direkt per E-Mail? <a href="mailto:kontakt@klarundsimple.com" class="text-brand-300 hover:text-brand-200 underline">kontakt@klarundsimple.com</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 py-16 px-6 mt-10">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between gap-6 text-sm text-white/40">
      <div>© <span id="year"></span> Klar &amp; Simple</div>
      <div class="flex gap-6">
        <a href="./index.html" class="hover:text-white transition cursor-pointer">Startseite</a>
        <a href="./impressum.html" class="hover:text-white transition cursor-pointer">Impressum</a>
        <a href="./datenschutz.html" class="hover:text-white transition cursor-pointer">Datenschutz</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Scroll progress bar
    const progressBar = document.getElementById('scroll-progress');
    if (progressBar) {
      const updateProgress = () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const p = docHeight > 0 ? Math.min(1, scrollTop / docHeight) : 0;
        progressBar.style.transform = `scaleX(${p})`;
      };
      updateProgress();
      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
    }

    // Reveal on scroll
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); revealObserver.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll('[data-reveal]').forEach(el => revealObserver.observe(el));

    // Form submission
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const btn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('submit-label');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.className = 'hidden';
      btn.disabled = true;
      btnLabel.textContent = 'Wird gesendet…';

      // Bot check
      if (form.botcheck.checked) return;

      const data = new FormData(form);
      const object = Object.fromEntries(data.entries());
      // Add source info for context in the mail
      object.from_page = 'klar-und-simple.de/kontakt';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(object)
        });
        const json = await res.json();
        if (json.success) {
          status.className = 'block text-center rounded-2xl p-4 bg-green-500/20 text-green-300 border border-green-500/30';
          status.textContent = 'Danke! Deine Nachricht ist angekommen. Ich melde mich in den nächsten Tagen.';
          form.reset();
          btnLabel.textContent = 'Gesendet ✓';
        } else {
          throw new Error(json.message || 'Fehler beim Senden');
        }
      } catch (err) {
        status.className = 'block text-center rounded-2xl p-4 bg-red-500/20 text-red-300 border border-red-500/30';
        status.textContent = 'Ups, das hat nicht geklappt. Bitte schreib mir direkt per E-Mail: kontakt@klarundsimple.com';
        btn.disabled = false;
        btnLabel.textContent = 'Nachricht senden';
      }
    });

    // Nav scrolled state
    const nav = document.getElementById('nav');
    const setNav = () => nav.classList.toggle('is-scrolled', window.scrollY > 20);
    setNav(); window.addEventListener('scroll', setNav, { passive: true });
  </script>
</body>
</html>
